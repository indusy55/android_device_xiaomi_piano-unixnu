name: package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: IssacL04/UniXNU_Enc3l
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: xiaomi-pad-8-pro-development/android_device_xiaomi_piano-uefi
          path: uefi-example
          submodules: recursive

      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools openssl@3
          for t in clang xcodebuild make git ninja cmake dtc mformat mcopy hdiutil diskutil curl python3; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; exit 1; }
          done

      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set repository secret UNIXNU_UNIQUE_CHIP_ID to 8 hex digits' >&2
            exit 1
          fi

      - name: external inputs
        env:
          IPSW_URL: https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inputs"
          curl -fL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/inputs/Restore.ipsw" "$IPSW_URL"
          python3 - <<'PY'
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'inputs'
          wanted = {
              '044-76040-038.dmg': '044-76040-038.dmg',
              '044-76034-038.dmg': '044-76034-038.dmg',
              'Firmware/044-76040-038.dmg.trustcache': '044-76040-038.dmg.trustcache',
              'Firmware/044-76034-038.dmg.trustcache': '044-76034-038.dmg.trustcache',
          }
          with zipfile.ZipFile(root / 'Restore.ipsw') as archive:
              names = set(archive.namelist())
              for member, output in wanted.items():
                  key = member if member in names else next(n for n in names if n.endswith('/' + member))
                  (root / output).write_bytes(archive.read(key))
                  print(output, (root / output).stat().st_size)
          PY
          python3 device/scripts/prepare-original-trust.py \
            --tree "$PWD/UniXNU" --inputs "$RUNNER_TEMP/inputs" \
            --output "$RUNNER_TEMP/inputs/original-trust.bin"

      - name: data seed
        run: |
          sudo python3 device/scripts/prepare-ram-data.py \
            --tree "$PWD/UniXNU" \
            --source "$RUNNER_TEMP/inputs/044-76040-038.dmg" \
            --systemos "$RUNNER_TEMP/inputs/044-76034-038.dmg" \
            --output "$RUNNER_TEMP/seed" \
            --config device/configs/piano_defconfig

      - name: local config
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          cat > UniXNU/unixnu.local.toml <<EOF
          [build]
          device = "../device"
          uefi = "$PWD/uefi-example/deps/Mu-Silicium"
          unique_chip_id = "$seed"
          dtb = "$RUNNER_TEMP/board.dtb"
          trust_cache = "$RUNNER_TEMP/inputs/original-trust.bin"
          data_ramdisk = "$RUNNER_TEMP/seed/data.dbrdisk"
          jobs = 8
          target = "DEBUG"
          EOF

      - name: dependencies and boot DTB
        run: |
          cd UniXNU
          ./unixnu fetch -D ../device
          SOC_DTS=$(echo out/feeds/UniXNU-sm8750-common-*/dts)
          test -d "$SOC_DTS"
          dtc -I dts -O dtb -i "$SOC_DTS" -o "$RUNNER_TEMP/board.dtb" ../device/dts/piano.dts

      - name: verified-root policies and GPU firmware
        run: |
          cd UniXNU
          ./unixnu tree -D ../device
          TREE=$(echo out/piano/*/*/tree)
          test -d "$TREE"
          python3 ../device/scripts/prepare-ufs-policies.py \
            --tree "$PWD/$TREE" --inputs "$RUNNER_TEMP/inputs" \
            --openssl-prefix "$(brew --prefix openssl@3)"
          FIRMWARE="$TREE/.cache/firmware/piano-gpu"
          mkdir -p "$FIRMWARE"
          cp ../device/firmware/gen80000_* "$FIRMWARE/"
          cd ../device/firmware
          for panel in boe csot; do
            xxd -i "novatek_nt36532_piano_fw_${panel}.bin" \
              | sed "s/novatek_nt36532_piano_fw_${panel}_bin/nvt_fw_${panel}/g" \
              > "$OLDPWD/$TREE/drivers/PaganiInput/Nvt/NvtFirmware_${panel}.inc"
          done
      - name: package
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          device/scripts/package.sh --os 17 --no-deps \
            --ipsw "$RUNNER_TEMP/inputs/Restore.ipsw" \
            --uefi "$PWD/uefi-example/deps/Mu-Silicium" \
            --dtb "$RUNNER_TEMP/board.dtb" \
            --trust-cache "$RUNNER_TEMP/inputs/original-trust.bin" \
            --data-ramdisk "$RUNNER_TEMP/seed/data.dbrdisk"

      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-17
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/piano/*/*/boot/boot.img
            UniXNU/out/piano/*/*/payload/payload.img
            UniXNU/out/piano/*/*/kernel/kernel.macho
            UniXNU/out/piano/*/*/package.manifest.json
